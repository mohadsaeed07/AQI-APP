name: Production CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  packages: write

jobs:
  # ====================================================
  # Stage 1: Quality & Automated Testing
  # ====================================================
  lint-and-test:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff pytest httpx
        pip install -r requirements.txt

    - name: Run Ruff (Linter & Style Checker)
      run: ruff check .

    - name: Run Pytest Test Suite
      env:
        OPENWEATHER_API_KEY: "dummy_test_key"
      run: pytest -v tests/

  # ====================================================
  # Stage 2: Secret & Security Detection
  # ====================================================
  secret-scan:
    name: Secret Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Run Gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ====================================================
  # Stage 3: Kubernetes Manifest Schema Validation
  # ====================================================
  k8s-validate:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Kubeconform
      run: |
        curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar -xz
        sudo mv kubeconform /usr/local/bin/

    - name: Validate Manifests Against K8s Schema
      run: |
        # Validate all YAML manifests in k8s/ (ignoring secret.yaml as it is generated)
        kubeconform -summary -strict -ignore-missing-schemas k8s/backend.yaml k8s/frontend.yaml

  # ====================================================
  # Stage 4: Container Build, CVE Scan, and Registry Push
  # ====================================================
  build-scan-and-push:
    name: Build, Scan & Publish Images
    needs: [lint-and-test, secret-scan, k8s-validate]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry (ghcr.io)
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Backend Image
      run: |
        docker build -t ghcr.io/${{ github.repository }}/backend:${{ github.sha }} -t ghcr.io/${{ github.repository }}/backend:latest -f Dockerfile.backend .

    - name: Build Frontend Image
      run: |
        docker build -t ghcr.io/${{ github.repository }}/frontend:${{ github.sha }} -t ghcr.io/${{ github.repository }}/frontend:latest -f Dockerfile.frontend .

    - name: Scan Backend Image for Vulnerabilities (Trivy)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
        format: 'table'
        exit-code: '0'
        severity: 'CRITICAL,HIGH'

    - name: Push Container Images to ghcr.io
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      run: |
        docker push ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
        docker push ghcr.io/${{ github.repository }}/backend:latest
        docker push ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
        docker push ghcr.io/${{ github.repository }}/frontend:latest
