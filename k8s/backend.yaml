apiVersion: apps/v1
kind: Deployment
metadata:
  name: aqi-backend
  labels:
    app: aqi-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aqi-backend
  template:
    metadata:
      labels:
        app: aqi-backend
    spec:
      containers:
      - name: backend
        image: aqi-backend:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        envFrom:
        - secretRef:
            name: aqi-secret
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "250m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /healthz/live
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz/ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: aqi-backend-service
spec:
  type: ClusterIP
  selector:
    app: aqi-backend
  ports:
  - port: 8000
    targetPort: 8000
